[project]
name = "mloadout"
version = "0.1.0"
description = "Generic personal dev setup: pinned Agent Skills and the tooling around them"
requires-python = ">=3.12"
# Keep in step with the inline script metadata at the top of bootstrap.py.
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
