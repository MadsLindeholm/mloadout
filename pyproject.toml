[project]
name = "mloadout"
version = "0.1.2"
description = "Generic personal dev setup: pinned Agent Skills and the tooling around them"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
mloadout = "mloadout.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mloadout"]

# skills/sources.yaml stays at the repo root (the ADRs point there); the wheel
# carries a copy so an installed tool has its base sources without the repo.
[tool.hatch.build.targets.wheel.force-include]
"skills/sources.yaml" = "mloadout/data/sources.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
